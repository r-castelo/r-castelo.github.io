<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inner Meridian</title>
<meta name="description" content="Inner Meridian: guided meditation journeys. One purchase, no subscription.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0706; --raised: #1e1612; --text: #f5ece6; --muted: #bba89d; --accent: #ffb547; --line: #ffffff20; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 17px/1.65 'DM Sans', system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 20px 80px; }
  .mark { width: 40px; height: 40px; border-radius: 50%; margin-bottom: 28px;
    background: radial-gradient(circle at 50% 50%, var(--bg) 52%, transparent 54%),
                radial-gradient(circle at 50% 50%, #ffb547 0, #ff6a00 58%, #ff5a3c00 72%); }
  h1 { font: 400 34px/1.2 Manrope, system-ui, sans-serif; margin: 0 0 8px; letter-spacing: -0.01em; }
  h2 { font: 600 19px/1.4 Manrope, system-ui, sans-serif; margin: 40px 0 8px; }
  p, li { color: var(--text); }
  em { color: var(--muted); font-style: normal; }
  ul { padding-left: 1.2em; }
  li { margin: 6px 0; }
  a { color: var(--accent); text-underline-offset: 3px; }
  .lead { color: var(--muted); }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"></div>
<h1>Inner Meridian</h1>
<p class="lead">Guided meditation journeys for calm, focus and confidence. One purchase, no subscription.</p>
<p><a href="privacy/">Privacy policy</a></p>
<footer>Inner Meridian · <a href="mailto:hello@heyrenato.com">hello@heyrenato.com</a></footer>
</main>
</body>
</html>
